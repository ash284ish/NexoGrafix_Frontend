name: Deploy Frontend to Hostinger KVM2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-kvm2-frontend-main
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    container: node:20-alpine

    steps:
      - name: Install system dependencies
        run: apk add --no-cache git openssh-client python3 make g++

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare Artifacts
        run: |
          mkdir -p deploy_dist
          cp -r .next public package.json package-lock.json deploy_dist/
          [ -f next.config.ts ] && cp next.config.ts deploy_dist/ || true
          [ -f next.config.js ] && cp next.config.js deploy_dist/ || true
          [ -f next.config.mjs ] && cp next.config.mjs deploy_dist/ || true
          [ -f tailwind.config.js ] && cp tailwind.config.js deploy_dist/ || true
          [ -f postcss.config.js ] && cp postcss.config.js deploy_dist/ || true
          [ -f postcss.config.mjs ] && cp postcss.config.mjs deploy_dist/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: deploy_dist/
          retention-days: 1

  deploy:
    name: Deploy to server
    needs: build-and-validate
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_FRONTEND_APP_DIR: ${{ secrets.HOSTINGER_FRONTEND_APP_DIR }}
      HOSTINGER_FRONTEND_SERVICE_NAME: ${{ secrets.HOSTINGER_FRONTEND_SERVICE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: deploy_dist/

      - name: Install deployment tools
        run: |
          sudo apt-get update && sudo apt-get install -y netcat-openbsd rsync

      - name: Network Diagnostic
        run: |
          echo "Testing connectivity to $HOSTINGER_HOST on port $HOSTINGER_SSH_PORT..."
          if nc -zv -w 10 "$HOSTINGER_HOST" "$HOSTINGER_SSH_PORT"; then
            echo "Connectivity check passed."
          else
            echo "::warning::Network connectivity check failed to $HOSTINGER_HOST:$HOSTINGER_SSH_PORT. Attempting to proceed..."
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Create and set permissions for target directory
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "sudo mkdir -p '$HOSTINGER_FRONTEND_APP_DIR' && sudo chown -R '$HOSTINGER_USER':'$HOSTINGER_USER' '$HOSTINGER_FRONTEND_APP_DIR'"

      - name: Sync full source to Hostinger
        run: |
          # Sync full repo source (excluding git metadata and node_modules)
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $HOSTINGER_SSH_PORT" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='deploy_dist' \
            ./ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_FRONTEND_APP_DIR}/"

          # Overlay the pre-built .next and other build artifacts
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $HOSTINGER_SSH_PORT" \
            deploy_dist/ \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_FRONTEND_APP_DIR}/"

      - name: Production Restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$HOSTINGER_SSH_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" "
            set -euo pipefail
            cd \"${HOSTINGER_FRONTEND_APP_DIR}\"

            # Load Node.js environment
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\" || true

            # Install production dependencies only
            npm install --production

            mkdir -p public/uploads

            # Service management
            if command -v systemctl >/dev/null 2>&1 && [ -n \"${HOSTINGER_FRONTEND_SERVICE_NAME}\" ] && systemctl show \"${HOSTINGER_FRONTEND_SERVICE_NAME}\" --property=LoadState 2>/dev/null | grep -q \"LoadState=loaded\"; then
              echo \"Restarting via Systemd...\"
              sudo systemctl restart \"${HOSTINGER_FRONTEND_SERVICE_NAME}\"
              sudo systemctl --no-pager --full status \"${HOSTINGER_FRONTEND_SERVICE_NAME}\"
            elif command -v pm2 >/dev/null 2>&1; then
              echo \"Restarting via PM2...\"
              pm2 restart \"${HOSTINGER_FRONTEND_SERVICE_NAME:-nexografix}\" || pm2 start npm --name \"${HOSTINGER_FRONTEND_SERVICE_NAME:-nexografix}\" -- start
            else
              echo \"Restarting via nohup...\"
              sudo fuser -k 3000/tcp || true
              nohup npm start > nextjs.log 2>&1 < /dev/null &
              sleep 5
              if pgrep -f \"next-server\" > /dev/null || pgrep -f \"next start\" > /dev/null; then
                echo \"Application started successfully!\"
              else
                echo \"Application failed to start. Log snippet:\"
                tail -n 20 nextjs.log
                exit 1
              fi
            fi
            "
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_FRONTEND_APP_DIR: ${{ secrets.HOSTINGER_FRONTEND_APP_DIR }}
          HOSTINGER_FRONTEND_SERVICE_NAME: ${{ secrets.HOSTINGER_FRONTEND_SERVICE_NAME }}